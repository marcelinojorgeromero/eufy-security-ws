name: Question
description: Here you can ask questions 
title: "[Question]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Questions about this compatibility build are welcome. Never include
        credentials, tokens, serial numbers, or private addresses.
  - type: textarea
    id: question
    attributes:
      label: Ask your question
      description: A clear and concise question
      placeholder: Is it possible to make coffee with this adapter?
    validations:
      required: true
