name: Feature Request
description: Suggest an idea for this project
title: "[Feature request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Keep requests narrow and backward compatible. Device-specific changes
        require matching hardware or sanitized reproducible fixtures.
  - type: textarea
    id: feature-request
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen.
      placeholder: Tell us what you want!
    validations:
      required: true
