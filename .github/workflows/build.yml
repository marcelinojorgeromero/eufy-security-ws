name: Build

on:
  push:
    branches: [ "master", "develop", "feature/mega-v6-compatibility" ]
  pull_request:
    branches: [ "master", "develop", "feature/mega-v6-compatibility" ]

jobs:
  build:
    name: Run build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run build
        run: npm run build
